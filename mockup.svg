<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="760" fill="#f4f3ef"/>

  <!-- App frame -->
  <rect x="20" y="20" width="1160" height="720" rx="10" fill="#ffffff" stroke="#d8d5cd" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="1160" height="64" rx="10" fill="#7a3b3b"/>
  <rect x="20" y="64" width="1160" height="20" fill="#7a3b3b"/>
  <text x="48" y="60" font-size="24" fill="#ffffff" font-weight="bold">Image Compressor</text>
  <text x="1000" y="60" font-size="13" fill="#f0dede">PCA-based compression</text>

  <!-- Sidebar -->
  <rect x="20" y="84" width="300" height="656" fill="#faf8f5" stroke="#e2e0da" stroke-width="1"/>

  <!-- Step 1: upload -->
  <text x="44" y="122" font-size="14" font-weight="bold" fill="#333">1. Upload an image</text>
  <rect x="44" y="136" width="252" height="86" rx="8" fill="#ffffff" stroke="#7a3b3b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="172" font-size="12" fill="#7a3b3b" text-anchor="middle">Drag &amp; drop or click</text>
  <text x="170" y="190" font-size="12" fill="#7a3b3b" text-anchor="middle">to browse (.jpg / .png)</text>
  <text x="170" y="246" font-size="12" fill="#7a91a3" text-anchor="middle" text-decoration="underline">...or try a demo image</text>

  <!-- Step 2: slider -->
  <text x="44" y="292" font-size="14" font-weight="bold" fill="#333">2. Compression level (k)</text>
  <line x1="44" y1="328" x2="296" y2="328" stroke="#d8d5cd" stroke-width="6" stroke-linecap="round"/>
  <line x1="44" y1="328" x2="150" y2="328" stroke="#7a3b3b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="328" r="10" fill="#ffffff" stroke="#7a3b3b" stroke-width="3"/>
  <text x="44" y="348" font-size="11" fill="#888">1</text>
  <text x="288" y="348" font-size="11" fill="#888" text-anchor="end">max</text>
  <text x="170" y="368" font-size="12" fill="#555" text-anchor="middle">k = 15  (more &#8596; less compression)</text>

  <!-- Step 3: stats -->
  <text x="44" y="412" font-size="14" font-weight="bold" fill="#333">3. Compression stats</text>
  <rect x="44" y="424" width="252" height="150" rx="6" fill="#ffffff" stroke="#e2e0da"/>
  <g font-size="12" fill="#444">
    <text x="58" y="448">Dimensions</text><text x="280" y="448" text-anchor="end">480 &#215; 360</text>
    <line x1="58" y1="456" x2="282" y2="456" stroke="#eee"/>
    <text x="58" y="474">Original size</text><text x="280" y="474" text-anchor="end">518,400</text>
    <line x1="58" y1="482" x2="282" y2="482" stroke="#eee"/>
    <text x="58" y="500">Compressed size</text><text x="280" y="500" text-anchor="end">37,800</text>
    <line x1="58" y1="508" x2="282" y2="508" stroke="#eee"/>
    <text x="58" y="526">Size reduction</text><text x="280" y="526" text-anchor="end">92.7%</text>
    <line x1="58" y1="534" x2="282" y2="534" stroke="#eee"/>
    <text x="58" y="552">Approx. error</text><text x="280" y="552" text-anchor="end">14.2</text>
  </g>

  <!-- Main area: side-by-side comparison -->
  <text x="344" y="122" font-size="14" font-weight="bold" fill="#333">Original</text>
  <text x="704" y="122" font-size="14" font-weight="bold" fill="#333">Compressed (k = 15)</text>

  <rect x="344" y="136" width="340" height="340" rx="6" fill="#e9e7e1" stroke="#d8d5cd"/>
  <rect x="704" y="136" width="340" height="340" rx="6" fill="#e9e7e1" stroke="#d8d5cd"/>
  <!-- simple placeholder "photo" glyph on each -->
  <g transform="translate(344,136)">
    <circle cx="90" cy="90" r="26" fill="#cfcabb"/>
    <polygon points="10,300 130,190 200,250 270,150 330,300" fill="#b9c9b2"/>
  </g>
  <g transform="translate(704,136)">
    <circle cx="90" cy="90" r="26" fill="#cfcabb" opacity="0.6"/>
    <polygon points="10,300 130,190 200,250 270,150 330,300" fill="#b9c9b2" opacity="0.6"/>
    <rect x="0" y="0" width="340" height="340" fill="url(#blurLines)" opacity="0.25"/>
  </g>
  <defs>
    <pattern id="blurLines" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="2"/>
    </pattern>
  </defs>


  <!-- Footer note -->
  <rect x="344" y="530" width="700" height="120" rx="6" fill="#fbf4ee" stroke="#e7d6c8"/>
  <text x="364" y="556" font-size="13" font-weight="bold" fill="#7a3b3b">Design notes</text>
  <text x="364" y="580" font-size="12" fill="#555">- Upload and the k-slider live together in a persistent left sidebar so users</text>
  <text x="364" y="598" font-size="12" fill="#555">  can re-adjust compression without re-uploading.</text>
  <text x="364" y="616" font-size="12" fill="#555">- Original vs. compressed sit side by side at equal size for direct comparison,</text>
  <text x="364" y="634" font-size="12" fill="#555">  with live stats (size reduction, error) directly below the controls that caused them.</text>

</svg>
